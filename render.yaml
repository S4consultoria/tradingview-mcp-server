services:
  - type: web
    name: tradingview-mcp-server
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: TV_USERNAME
        sync: false
      - key: TV_PASSWORD
        sync: false
